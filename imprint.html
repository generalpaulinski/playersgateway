  <style>
    :root {
      --background: #F4F5F3;
      --text: #111214;
      --secondary: #73777C;
      --line: #C9CCCE;
    }

    * {
      box-sizing: border-box;
    }

    html,

      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);

      font-size: 10px;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 46px;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .section {
      padding-top: 18px;
      margin-top: 18px;
      border-top: 1px solid var(--line);
    }

    .label {
      margin-bottom: 12px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      color: var(--secondary);
      text-transform: uppercase;
    }

    p {
      margin: 0 0 28px;
      font-size: 14px;
      line-height: 1.7;
    }

    a {
      color: inherit;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 22px;
      }

      .back {
        margin-bottom: 58px;
      }

      h1 {
        font-size: 36px;
      }
    }
  </style>
